name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Reject legacy hardware configuration names
        run: |
          ! grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=.pytest_cache \
            --exclude-dir=__pycache__ \
            --exclude=quality.yml \
            -E 'ROVER_MOTOR_API_TOKEN|MOTOR_HARDWARE_ENABLED|motor_hardware_enabled|X-Rover-Motor-Token' \
            .
      - run: bash scripts/quality.sh
